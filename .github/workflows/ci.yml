name: ci

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify required governance files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f LEARNINGS.md
          test -f .github/pull_request_template.md
          test -f .github/agents/README.md


  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-synthetic-demo-key
      TRAVELSTAN_PROVIDERS: synthetic_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Django checks
        run: python manage.py check --fail-level WARNING
      - name: Tests
        run: python manage.py test --verbosity 2
